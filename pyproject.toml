[project]
name = "ai-website-audit-cli"
version = "1.0.0"
description = "Open-source CLI for AI-assisted website audits, deterministic SEO/UX/accessibility/performance checks, and Markdown/HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Open Source Maintainers" }]
keywords = ["openai", "website-audit", "seo", "ux", "accessibility", "cli", "ai", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "beautifulsoup4>=4.12.3",
  "openai>=2.0.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.3",
  "rich>=13.7.1",
  "typer>=0.12.3",
]

[project.scripts]
ai-website-audit = "ai_website_audit.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
